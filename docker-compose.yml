name: ai-adventures

services:
  redis:
    image: redis:7
    container_name: ai-adventures-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  server:
    build: ./server
    container_name: ai-adventures-server
    env_file: ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: ai-adventures-client
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  redis-data: